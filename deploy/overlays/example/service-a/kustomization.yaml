apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: onboarding-example
resources:
  - ../../../base/service-a
images:
  - name: service-a
    newTag: b5e3eda
patches:
  - target:
      kind: Deployment
      name: service-a
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "3000"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: QUARKUS_LOG_LEVEL
          value: "DEBUG"
