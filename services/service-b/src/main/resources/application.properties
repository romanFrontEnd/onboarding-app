# Common settings
info.app.name=service-b
info.app.version=1.0.0
info.app.type=quarkus
info.app.java.version=${java.version}

# Logging
quarkus.log.json.fields.mdc.flat-fields=true
quarkus.log.json.fields.process-id.enabled=false
quarkus.log.json.fields.sequence.enabled=false
quarkus.log.json.fields.thread-id.enabled=false
quarkus.log.json.fields.thread-name.enabled=false
bsi.log.http-headers=X-Transaction-Id

# Quarkus settings
quarkus.application.name=service-b
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p (applicationName=${quarkus.application.name}, traceId=%X{traceId}, spanId=%X{spanId}, sampled=%X{sampled}) [%c{2.}] (%t) %s%e%n
quarkus.log.category."com.videotron.bsi.service.b".level=INFO

#Enable Metrics and Logs Telemetry Export
quarkus.otel.metrics.enabled=true
quarkus.otel.logs.enabled=true

quarkus.otel.exporter.otlp.endpoint=http://localhost:4318
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.resource.attributes=service.instance.id=${SERVICE_INSTANCE_ID:local},service.namespace=${SERVICE_NAMESPACE:onboarding},deployment.environment=local
quarkus.micrometer.binder.http-server.ignore-patterns=/q/.*
